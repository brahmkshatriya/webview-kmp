name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  target:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: android
            name: Android
            runner: ubuntu-24.04
            android: true
            tasks: ':webview-core:compileAndroidMain :webview-android:compileAndroidMain :webview-compose:compileAndroidMain'
          - id: js
            name: JavaScript
            runner: ubuntu-24.04
            tasks: ':webview-core:compileKotlinJs :webview-js:compileKotlinJs :webview-compose:compileKotlinJs'
          - id: linux-x64
            name: Linux x64
            runner: ubuntu-24.04
            linux: true
            expected_arch: x86_64
            tasks: ':webview-core:linuxX64Test :webview-linux:linuxX64Test :webview-compose:compileKotlinLinuxX64'
          - id: linux-arm64
            name: Linux arm64
            runner: ubuntu-24.04-arm
            linux: true
            expected_arch: aarch64
            tasks: ':webview-core:compileKotlinLinuxArm64 :webview-linux:compileKotlinLinuxArm64 :webview-compose:compileKotlinLinuxArm64'
          - id: windows-x64
            name: Windows x64
            runner: windows-2025
            tasks: ':webview-core:compileKotlinMingwX64 :webview-windows:compileKotlinMingwX64 :webview-compose:compileKotlinMingwX64'
          - id: macos-x64
            name: macOS x64
            runner: macos-15-intel
            expected_arch: x86_64
            tasks: ':webview-core:compileKotlinMacosX64 :webview-macos:compileKotlinMacosX64 :webview-compose:compileKotlinMacosX64'
          - id: macos-arm64
            name: macOS arm64
            runner: macos-15
            expected_arch: arm64
            tasks: ':webview-core:compileKotlinMacosArm64 :webview-macos:compileKotlinMacosArm64 :webview-compose:compileKotlinMacosArm64'
          - id: ios-arm64
            name: iOS arm64
            runner: macos-15
            expected_arch: arm64
            tasks: ':webview-core:compileKotlinIosArm64 :webview-ios:compileKotlinIosArm64 :webview-compose:compileKotlinIosArm64'
          - id: ios-simulator-arm64
            name: iOS Simulator arm64
            runner: macos-15
            expected_arch: arm64
            tasks: ':webview-core:compileKotlinIosSimulatorArm64 :webview-ios:compileKotlinIosSimulatorArm64 :webview-compose:compileKotlinIosSimulatorArm64'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        if: matrix.linux != true
        with:
          distribution: corretto
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        if: matrix.linux != true

      - uses: android-actions/setup-android@v4
        if: matrix.android == true
      - name: Install Android SDK
        if: matrix.android == true
        shell: bash
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'

      - name: Verify runner architecture
        if: matrix.expected_arch
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"

      - name: Verify Xcode
        if: startsWith(matrix.id, 'macos-') || startsWith(matrix.id, 'ios-')
        shell: bash
        run: xcodebuild -version

      - name: Build Linux target
        if: matrix.linux == true
        shell: bash
        env:
          TARGET_TASKS: ${{ matrix.tasks }}
        run: |
          set -euo pipefail
          chmod +x scripts/run-linux-ci.sh
          scripts/run-linux-ci.sh $TARGET_TASKS

      - name: Build target
        if: matrix.linux != true
        shell: bash
        env:
          TARGET_TASKS: ${{ matrix.tasks }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --no-configuration-cache $TARGET_TASKS

  publication-metadata:
    name: Maven publication metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build KMP root publications
        shell: bash
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: 0.0.0-ci
        run: |
          set -euo pipefail
          rm -rf build/maven-release-shard
          chmod +x scripts/run-linux-ci.sh
          scripts/run-linux-ci.sh \
            :webview-core:publishKotlinMultiplatformPublicationToReleaseShardRepository \
            :webview-compose:publishKotlinMultiplatformPublicationToReleaseShardRepository \
            :webview-android:publishKotlinMultiplatformPublicationToReleaseShardRepository \
            :webview-ios:publishKotlinMultiplatformPublicationToReleaseShardRepository \
            :webview-js:publishKotlinMultiplatformPublicationToReleaseShardRepository \
            :webview-linux:publishKotlinMultiplatformPublicationToReleaseShardRepository \
            :webview-macos:publishKotlinMultiplatformPublicationToReleaseShardRepository \
            :webview-windows:publishKotlinMultiplatformPublicationToReleaseShardRepository
          python3 scripts/prepare-maven-central-bundle.py \
            --repository build/maven-release-shard \
            --staging build/central-metadata-check \
            --version 0.0.0-ci
